name: BMS Doomsday Monitor

# Reliable 5-minute checking WITHOUT depending on GitHub's (unreliable) cron:
# one job runs for ~5.5 hours, checking every 5 min internally, then re-launches
# itself. The sparse schedule below is only a safety net to restart the loop if a
# run ever dies unexpectedly.

on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to run before self-restarting (default 330 = ~5.5h). Use a small value to test the self-restart."
        required: false
        default: "330"
  schedule:
    - cron: "*/30 * * * *" # best-effort backup restart; the loop self-restarts via ACTIONS_PAT

concurrency:
  group: bms-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Carry alert/baseline/heartbeat state across loop restarts.
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: state.json
          key: bms-state-${{ github.run_id }}
          restore-keys: |
            bms-state-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Watch loop (check every 5 min for ~5.5h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOVIE_URL: ${{ secrets.MOVIE_URL }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes }}
        run: |
          MINUTES="${LOOP_MINUTES:-330}"
          case "$MINUTES" in *[!0-9]*|'') MINUTES=330;; esac
          echo "loop window: ${MINUTES} min"
          END=$(( $(date +%s) + MINUTES*60 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            echo "::group::check #$i ($(date -u '+%H:%M:%S') UTC)"
            node monitor.mjs || true
            echo "::endgroup::"
            # don't start a sleep that would overrun the window
            [ "$(( $(date +%s) + 300 ))" -ge "$END" ] && break
            sleep 300
          done
          echo "loop finished after $i checks"

      - name: Re-launch next loop (self-restart)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run monitor.yml --repo "${{ github.repository }}" && echo "next loop dispatched"
          else
            echo "ACTIONS_PAT secret not set yet -> relying on the */30 schedule to restart."
          fi
